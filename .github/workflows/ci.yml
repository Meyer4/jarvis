name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test APK
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Install Android platform 36
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Build and test
        shell: bash
        run: |
          set +e
          ./gradlew --no-daemon clean testDebugUnitTest assembleDebug --stacktrace > gradle-build.log 2>&1
          result=$?
          if [ "$result" -ne 0 ]; then
            diagnostics="$(grep -E '(^e: |^FAILURE:|^What went wrong:|^Execution failed|^Could not resolve|^Could not find|unresolved reference| error:)' gradle-build.log | tail -n 40)"
            log_tail="$(tail -n 60 gradle-build.log)"
            if [ -z "$diagnostics" ]; then diagnostics="$log_tail"; else diagnostics="$diagnostics"$'\n'"$log_tail"; fi
            printf '%s\n' "$diagnostics" >> "$GITHUB_STEP_SUMMARY"
            annotation="$(printf '%s' "$diagnostics" | tr '\n' ';' | cut -c1-6000 | sed 's/%/%25/g; s/::/%3A%3A/g')"
            echo "::error title=Gradle build failed::$annotation"
            tail -n 80 gradle-build.log
          fi
          exit "$result"

      - name: Upload debug APK and build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jarvisai-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            gradle-build.log
          if-no-files-found: warn
          retention-days: 14
