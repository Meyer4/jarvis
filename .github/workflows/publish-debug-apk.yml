name: Publish debug builds

# Builds the Android APK and the laptop app, then attaches them to a rolling pre-release so the
# newest builds can be downloaded from https://github.com/Meyer4/jarvis/releases
# without digging through workflow artifacts. Delete this file if you do not want it.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create or replace
        required: false
        default: debug-latest
  push:
    branches: [main]

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || 'debug-latest' }}

jobs:
  apk:
    name: Android APK
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Install Android platform 36
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Publish the APK to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          cp app/build/outputs/apk/debug/app-debug.apk jarvisai-debug.apk
          gh release delete "$RELEASE_TAG" --yes --cleanup-tag || true
          gh release create "$RELEASE_TAG" jarvisai-debug.apk \
            --title "JarvisAI downloads" \
            --prerelease \
            --notes "Automatic builds from commit \`${{ github.sha }}\` on \`${{ github.ref_name }}\`.

          These are debug-signed, pre-release builds for testing.

          **Android:** install \`jarvisai-debug.apk\` (allow installing unknown apps). No cloud AI keys are compiled in — add them in the app under **Cloud AI providers**. Speech, wake-word, and local GGUF files are not bundled; import them from the dashboard.

          **Laptop:** download the archive for your system, extract it, and run the JarvisAI launcher inside. Provider keys can be typed in the app or set as environment variables (for example \`MOONSHOT_API_KEY\`, \`OPENAI_API_KEY\`)."

  desktop:
    name: Laptop app (${{ matrix.os }})
    needs: apk
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Package the desktop app
        shell: bash
        run: ./gradlew --no-daemon :desktop:createDistributable

      - name: Archive the app image
        shell: bash
        run: |
          set -e
          APP_ROOT=desktop/build/compose/binaries/main/app
          APP_DIR="$(find "$APP_ROOT" -maxdepth 1 -mindepth 1 | head -n 1)"
          test -n "$APP_DIR"
          echo "Packaging $APP_DIR"
          tar -czf "jarvisai-desktop-${{ runner.os }}.tar.gz" -C "$(dirname "$APP_DIR")" "$(basename "$APP_DIR")"
          ls -lh "jarvisai-desktop-${{ runner.os }}.tar.gz"

      - name: Attach it to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" "jarvisai-desktop-${{ runner.os }}.tar.gz" --clobber
